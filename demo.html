<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Stock Scanner Demo</title>
<style>body{font-family:system-ui;margin:0;background:#f6f7f9;color:#17202a}header{background:#10243e;color:white;padding:22px}main{max-width:1000px;margin:auto;padding:20px}.tabs button{padding:10px;border:0;margin:3px}.tabs .on{background:#10243e;color:white}.panel{display:none}.panel.on{display:block}.card{background:white;margin:12px 0;padding:14px;border:1px solid #ddd;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}</style></head>
<body><header><h1>Stock Scanner — Demo</h1><div>DEMO DATA ONLY</div></header><main><div class=tabs>
<button class=on onclick=show('hourly',this)>Hourly</button><button onclick=show('daily',this)>Daily</button><button onclick=show('eod',this)>High Volume</button><button onclick=show('stockbee',this)>Stockbee</button></div>
<div id=hourly class="panel on"></div><div id=daily class=panel></div><div id=eod class=panel></div><div id=stockbee class=panel></div></main>
<script>
const D={hourly:[["Momentum","NVDA","S&P 500"],["NR7","AMD","Russell 2000"],["Dual BB 1h Bullish","AAPL","S&P 500"],["BullBhai Bullish Momentum","MSFT","S&P 500"]],daily:[["VCP","NVDA","S&P 500"],["NR6","RELIANCE.NS","Nifty 500"],["EP Breakout","AMD","Russell 2000"]],eod:[["High Volume","NVDA","S&P 500"],["High Volume","TCS.NS","Nifty 500"],["High Volume","PLTR","S&P 500"]],stockbee:[["Extreme Sales Growth","NVDA","USA"],["Sales Growth","PLTR","USA"],["ATR Entry Zone","AMD","USA"]]};
for(const [k,rows] of Object.entries(D)){document.getElementById(k).innerHTML='<h2>'+k.toUpperCase()+'</h2><div class=card><table><tr><th>Scan</th><th>Ticker</th><th>Universe</th></tr>'+rows.map(r=>'<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td><td>'+r[2]+'</td></tr>').join('')+'</table></div>'}
function show(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');b.classList.add('on')}
</script></body></html>
