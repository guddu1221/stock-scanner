name: Hourly Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * 1-5"

permissions:
  contents: write

jobs:
  hourly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run hourly scanner
        run: |
          python scripts/run_scanner.py hourly

      - name: Commit scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Update hourly scan results"
          git push
